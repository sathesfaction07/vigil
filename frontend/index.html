<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    surface: { DEFAULT: '#0a0e1a', raised: 'rgba(255,255,255,0.03)' },
                    accent: { DEFAULT: '#00d4aa', dim: 'rgba(0,212,170,0.15)' },
                },
                fontFamily: { sans: ['Inter', 'system-ui'], mono: ['JetBrains Mono', 'monospace'] },
            }
        }
    }
    </script>
    <style>
        body { background: #0a0e1a; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; }
        .card:hover { border-color: rgba(0,212,170,0.15); }
        .glow { box-shadow: 0 0 0 1px rgba(0,212,170,0.12), 0 0 20px -5px rgba(0,212,170,0.1); }
        .nav-blur { backdrop-filter: blur(12px); background: rgba(10,14,26,0.85); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .badge-violation { background: rgba(239,68,68,0.12); color: #f87171; }
        .badge-compliant { background: rgba(0,212,170,0.12); color: #00d4aa; }
        input, textarea, select { background: #111827 !important; border: 1px solid #1f2937 !important; color: #e5e7eb !important; border-radius: 12px; padding: 10px 14px; font-size: 13px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: rgba(0,212,170,0.5) !important; box-shadow: 0 0 0 2px rgba(0,212,170,0.1); }
        input::placeholder, textarea::placeholder { color: #4b5563 !important; }
        select option { background: #111827; color: #e5e7eb; }
        .badge-uncertain { background: rgba(245,158,11,0.12); color: #f59e0b; }
    </style>
</head>
<body class="text-slate-100 min-h-screen antialiased">
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
