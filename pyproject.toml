[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil"
version = "1.0.0"
description = "AI-powered content compliance pre-screening tool"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "redis>=5.0",
    "rq>=1.16",
    "boto3>=1.34",
    "google-cloud-language>=2.13",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.21",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
source = ["src"]

[tool.ruff.lint.per-file-ignores]
# prompts.py is entirely prompt text: rewrapping it changes what the model is sent, so the
# line limit does not apply. The test files hold long fixture strings for the same reason.
"src/content_guard/core/prompts.py" = ["E501"]
"tests/conftest.py" = ["E501"]
"tests/unit/test_classifier.py" = ["E501"]
